name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  Release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release (if missing)
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # If it already exists, don't fail the workflow
          if gh release view "${TAG}" --repo="$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            exit 0
          fi

          gh release create "${TAG}" \
            --repo="$GITHUB_REPOSITORY" \
            --title="${TAG#v} / $(date '+%Y-%m-%d')"

  Build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [Release]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: |
          mvn -B -ntp clean package

      - name: Create checksums
        run: |
          cd target
          # include both possibilities; some Jenkins plugins produce .hpi, some .jpi
          ls -1 *.hpi *.jpi 2>/dev/null | xargs -r sha256sum > checksums.sha256

      - name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          ASSETS=(target/*.hpi target/*.jpi target/checksums.sha256)

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No release assets found in target/ (expected *.hpi/*.jpi)."
            exit 1
          fi

          gh release upload "${TAG}" "${ASSETS[@]}" --repo="$GITHUB_REPOSITORY" --clobber
