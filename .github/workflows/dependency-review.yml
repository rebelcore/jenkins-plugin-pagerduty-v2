---
# Blocks a pull request that introduces a dependency with a known vulnerability
# or a licence we cannot ship under.
#
# GitHub reads pom.xml on its own, but only what is written in it: versions
# that come from a parent POM or an imported BOM, and every transitive
# dependency, are invisible to it. So the first job runs Maven's own
# resolution and submits the resolved run-time graph, and the review compares
# that graph with develop's. The push trigger keeps develop's graph current for the
# comparison.
name: Dependency Review

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    name: Dependency submission
    # Submitting needs contents: write, which GitHub never gives a pull request
    # from a fork. For those, the review below runs on GitHub's own reading of
    # pom.xml instead.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Only what the plugin needs at run time. Jenkins core and its own
      # libraries are `provided` (Jenkins supplies them; the .hpi never
      # contains them), and `test` is the test harness. Reviewing those would
      # hold this plugin to licences and advisories of code it does not ship.
      - uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        with:
          maven-args: -Dscopes=compile,runtime

  review:
    name: Dependency review
    # !cancelled() lets the review run when submit was skipped for a fork.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: submit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # The submission above can land a moment after the review starts.
          retry-on-snapshot-warnings: true
          # A copyleft dependency bundled into the artifact would change what
          # the whole thing can be distributed under. That is a decision to make
          # deliberately rather than discover in a dependency bump.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
