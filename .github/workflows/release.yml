---
# Releases are cut by tagging master (tag.yml does that). develop is the
# integration branch and is never tagged — the guard job below enforces that
# rather than trusting it.
#
# The tag's commit is built once, with the full `verify` (tests, coverage
# floor, lint, enforcer), and what it produced is attached to the GitHub
# release with sha256sums.txt and notes from CHANGELOG.md.
#
# Publishing to Maven Central or GitHub Packages is documented in
# CONTRIBUTING.md and deliberately not enabled here: a published version can
# never be replaced or deleted, so it is switched on per project, once someone
# actually needs to depend on this artifact from another build.
name: Release

on:
  push:
    tags: ["v*"]
  # For re-publishing an existing tag by hand. Nothing invokes this
  # automatically.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "25"
  # Only JDK 25 builds what gets released; see java.range in pom.xml.
  JAVA_RANGE: "[25,26)"

jobs:
  # Publishing is hard to undo: a GitHub release is visible the moment it
  # exists. A tag pushed from the wrong branch, or one that disagrees with
  # VERSION, is an easy mistake and an expensive one to discover afterwards, so
  # both are checked first.
  guard:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tagged commit is on master
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tag ${GITHUB_REF_NAME} points at a commit that is not on master."
            exit 1
          fi

      - name: Check the tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${version}."
            exit 1
          fi

  release:
    name: Build and publish the GitHub release
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache: a release is built from a clean state that no
      # earlier run can have poisoned.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The .hpi plus sha256sums.txt, into dist/.
      - name: Build
        run: make dist

      # The handwritten half of the release notes comes from CHANGELOG.md; GitHub
      # appends the generated list of merged pull requests below it (grouped by
      # .github/release.yml).
      - name: Build the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          NOTES="$(awk -v ver="$VERSION" '
            /^## /{ current = ($2 == ver) ? 1 : 0; next }
            current { print }
          ' CHANGELOG.md | awk 'NF{p=1} p')"
          if [ -z "$NOTES" ]; then
            echo "::error::CHANGELOG.md has no entry under '## ${VERSION} / <date>'"
            exit 1
          fi
          {
            printf "## What's New\n\n%s\n\n" "$NOTES"
            printf "## Install\n\n"
            printf "Download \`pagerduty-v2-%s.hpi\` below and upload it under Manage Jenkins -> Plugins -> Advanced settings -> Deploy Plugin. " "$VERSION"
            printf "Verify downloads with \`sha256sum -c sha256sums.txt --ignore-missing\`.\n"
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          # A tag containing a hyphen is a pre-release by semver convention.
          prerelease: ${{ contains(github.ref_name, '-') }}
