---
# Runs on every pull request into develop or master, and on develop itself.
#
# Lint only formats and reads the sources, so a formatting mistake fails in
# about a minute instead of waiting behind the test suite.
name: Test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  # Only JDK 25 builds what gets released; see java.range in pom.xml.
  JAVA_RANGE: "[25,26)"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Licence headers
        run: make check-license

      - name: Spotless and Checkstyle
        run: make lint

  # A release pull request must carry its release notes. Checked here, on the
  # pull request, because after the merge the only place left to find out is a
  # failed tag.yml run on master.
  changelog:
    name: Changelog
    if: github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make check-changelog

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # `verify` is compile + tests + the coverage floor + Spotless + Checkstyle
      # + the enforcer rules, and packages exactly what a release would attach.
      # The Jenkins parent adds SpotBugs and a test that starts a real Jenkins
      # with the plugin installed.
      - name: Verify
        run: make dist

      - name: Upload the test and coverage reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14
