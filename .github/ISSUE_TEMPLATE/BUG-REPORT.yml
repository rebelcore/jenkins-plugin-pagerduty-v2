---
name: Bug Report
description: Create a report to help us improve.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out the following carefully in order to better fix the problem.

        If you have found a security vulnerability, do **not** file it here.
        See [SECURITY.md](https://github.com/rebelcore/jenkins-plugin-pagerduty-v2/blob/develop/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: |
        Check the issue is reproducible with the latest release.
        Manage Jenkins -> Plugins -> Installed shows it.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: jenkins-version
    attributes:
      label: Jenkins version
      description: Shown at the bottom right of every Jenkins page.
      placeholder: 2.568.3
    validations:
      required: true
  - type: dropdown
    id: job-type
    attributes:
      label: Job type
      options:
        - Pipeline
        - Freestyle
        - Multibranch
        - Other
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java version
      description: The output of `java -version`.
      placeholder: Temurin 25.0.4
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating System
      options:
        - Linux
        - MacOS
        - FreeBSD
        - Windows
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant part of the build's console output or the Jenkins system log, with secrets removed.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction Steps
      value: |
        1. Go to '...'
        2. Do '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: What did you expect to see?
    validations:
      required: true
  - type: textarea
    id: reality
    attributes:
      label: What did you see instead?
    validations:
      required: true
