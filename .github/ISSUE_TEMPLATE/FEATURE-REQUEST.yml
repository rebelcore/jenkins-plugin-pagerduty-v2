---
name: Feature Request
description: Suggest an idea for this project.
title: "[FEATURE REQUEST]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A brief explanation of the feature.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        What are you actually trying to do? Describing the underlying problem
        rather than the solution you have in mind often surfaces a better one.
      placeholder: I am trying to ... and currently I have to ...
    validations:
      required: true
  - type: textarea
    id: basic_example
    attributes:
      label: Basic Example
    validations:
      required: true
  - type: dropdown
    id: importance
    attributes:
      label: How important is this to you?
      options:
        - "Blocking — I cannot use this without it"
        - "Important — I have a workaround, but it is painful"
        - "Nice to have"
    validations:
      required: true
  - type: textarea
    id: drawbacks
    attributes:
      label: Drawbacks
      description: What are the drawbacks or impacts of this request?
    validations:
      required: true
