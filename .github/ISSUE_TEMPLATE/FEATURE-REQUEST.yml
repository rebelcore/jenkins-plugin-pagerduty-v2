name: Feature Request
description: Suggest an enhancement for the PagerDuty v2 Jenkins plugin.
title: "[FEATURE]: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please describe the problem you’re trying to solve and what “done” looks like.

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to achieve? What pain point does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your preferred solution/behavior.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, references, PagerDuty docs, related issues, etc.
    validations:
      required: false
